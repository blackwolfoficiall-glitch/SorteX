name: Mobile isolated test builds
on:
  push:
    branches: [feat/mobile-expo]
    paths: ['apps/mobile/**', 'packages/contracts/**', '.github/workflows/mobile-test-build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    if: github.ref == 'refs/heads/feat/mobile-expo' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/mobile
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: https://sortex-fase1-review.netlify.app/.netlify/functions/sortex-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm test
      - name: Generate native project without signing accounts
        run: npx expo prebuild --platform android --no-install
      - name: Build standalone APK with development signing key
        run: ./gradlew --no-daemon assembleRelease -PreactNativeArchitectures=arm64-v8a
        working-directory: apps/mobile/android
      - name: Check test destination and artifact size
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          test "$(stat -c %s android/app/build/outputs/apk/release/app-release.apk)" -lt 150000000
          sha256sum android/app/build/outputs/apk/release/app-release.apk
          analyzer="$(find "$ANDROID_HOME/cmdline-tools" -name apkanalyzer -type f | head -1)"
          "$analyzer" manifest permissions android/app/build/outputs/apk/release/app-release.apk > /tmp/sortex-apk-permissions.txt
          cat /tmp/sortex-apk-permissions.txt
          if grep -Eq 'android.permission.(CAMERA|RECORD_AUDIO|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|SYSTEM_ALERT_WINDOW|VIBRATE)$' /tmp/sortex-apk-permissions.txt; then
            echo 'Unexpected permission in test APK'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sortex-android-test-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  ios-simulator:
    if: github.ref == 'refs/heads/feat/mobile-expo' && github.event.repository.private == false
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/mobile
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: https://sortex-fase1-review.netlify.app/.netlify/functions/sortex-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Select an available iPhone simulator explicitly
        run: |
          # Expo CLI writes its device-tool cache here on a fresh runner.
          mkdir -p "$HOME/.expo"
          simulator_id="$(xcrun simctl list devices available --json | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{const groups=JSON.parse(s).devices;const device=Object.entries(groups).filter(([runtime])=>runtime.includes("iOS")).flatMap(([,devices])=>devices).find(d=>d.isAvailable && d.name.startsWith("iPhone"));if(!device)process.exit(1);console.log(device.udid);});')"
          xcrun simctl bootstatus "$simulator_id" -b
          echo "SORTEX_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
      - name: Build and launch iOS simulator without Apple enrollment
        run: npx expo run:ios --configuration Release --no-bundler --device "$SORTEX_SIMULATOR_ID"
      - name: Capture native launch
        run: |
          xcrun simctl io "$SORTEX_SIMULATOR_ID" screenshot /tmp/sortex-ios-simulator.png
          app_path="$(xcrun simctl get_app_container "$SORTEX_SIMULATOR_ID" br.com.sortex.development app)"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" /tmp/sortex-ios-simulator.zip
          test "$(stat -f %z /tmp/sortex-ios-simulator.zip)" -lt 100000000
      - uses: actions/upload-artifact@v4
        with:
          name: sortex-ios-simulator-screen-${{ github.sha }}
          path: |
            /tmp/sortex-ios-simulator.png
            /tmp/sortex-ios-simulator.zip
          retention-days: 1
          if-no-files-found: error
