name: Habilitar uma vez mídia privada da SorteX QA
on:
  push:
    branches: [homologacao/web-ios-integrada]
    paths: [.github/workflows/sortex-qa-activate-storage-once.yml]
permissions:
  contents: read
  actions: read
jobs:
  validate-window:
    if: github.repository == 'blackwolfoficiall-glitch/SorteX' && github.ref == 'refs/heads/homologacao/web-ios-integrada' && github.event.repository.private == false && github.run_attempt == '1' && github.event.head_commit.message == 'Retry QA cover storage after missing workflow secret'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Impedir reexecuções fora da janela autorizada
        shell: bash
        run: |
          set -euo pipefail
          now="$(date -u +%s)"
          test "$now" -ge "$(date -u -d '2026-11-26T15:16:00Z' +%s)"
          test "$now" -lt "$(date -u -d '2026-11-26T16:10:00Z' +%s)"
  enable:
    needs: validate-window
    concurrency:
      group: sortex-web-ios-qa-bootstrap
      cancel-in-progress: false
    if: github.repository == 'blackwolfoficiall-glitch/SorteX' && github.ref == 'refs/heads/homologacao/web-ios-integrada' && github.event.repository.private == false && github.run_attempt == '1'
    environment: sortex-web-ios-qa
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_API_SHA: 8f1c947c9197928c08e20716cc88cf406bae0722
      EXPECTED_API_DEPLOYMENT: '6'
      VALIDATED_CODE_SHA: 8f1c947c9197928c08e20716cc88cf406bae0722
      VALIDATED_CI_RUN: '45847126208'
      CONFIRM_STORAGE_BUCKET: sortex-qa-media
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Confirmar revisão e testar guardas sem credenciais
        shell: bash
        run: |
          set -euo pipefail
          for sha in "$EXPECTED_API_SHA" "$VALIDATED_CODE_SHA" b7edea01d44a86a9c3406690c65837dfeeb3a5d2; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            git merge-base --is-ancestor "$sha" HEAD
          done
          node --test services/api/scripts/activate-storage-isolated-qa.test.mjs
      - name: Atualizar somente as três flags de storage da QA
        env:
          QA_ENABLE: ${{ vars.SORTEX_QA_BOOTSTRAP }}
          SORTEX_QA_NEON_API_KEY: ${{ secrets.SORTEX_QA_NEON_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$SORTEX_QA_NEON_API_KEY" || { echo 'O secret protegido não chegou ao job; nenhuma operação executada.'; exit 1; }
          node services/api/scripts/activate-storage-isolated-qa.mjs
  check-draft-cover:
    needs: enable
    uses: ./.github/workflows/sortex-hosted-qa-smoke.yml
    with:
      expected-api-sha: 8f1c947c9197928c08e20716cc88cf406bae0722
      check-draft-cover: true
