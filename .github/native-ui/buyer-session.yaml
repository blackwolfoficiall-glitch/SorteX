appId: br.com.sortex.development
name: Login nativo (PostgreSQL local)
---
- extendedWaitUntil:
    visible:
      id: sortex-login-email
    timeout: 45000
- tapOn:
    id: sortex-login-email
- inputText: sortex-ios-ui@example.test
- tapOn:
    id: sortex-login-password
- inputText: ${BUYER_PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: sortex-login-submit
    direction: DOWN
- tapOn:
    id: sortex-login-submit
- extendedWaitUntil:
    visible: "Olá, CompradorIOS"
    timeout: 45000
