appId: br.com.sortex.development
name: Inicialização nativa sem credenciais
---
- extendedWaitUntil:
    visible:
      id: sortex-login-email
    timeout: 45000
- assertVisible:
    id: sortex-login-password
- scrollUntilVisible:
    element:
      id: sortex-login-submit
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: sortex-login-submit
