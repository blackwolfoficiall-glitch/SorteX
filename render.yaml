services:
  - type: web
    name: sortex-web-homologacao
    runtime: node
    region: oregon
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    startCommand: npm start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_INTERNAL_URL
        sync: false
      - key: API_URL
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false

  - type: web
    name: sortex-api-homologacao
    runtime: node
    region: oregon
    rootDir: services/api
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeployTrigger: off
    disk:
      name: sortex-api-storage
      mountPath: /var/data/sortex
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: sortex-postgres-homologacao
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: WEB_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ORGANIZER_UPLOAD_DIR
        value: /var/data/sortex/organizers
      - key: PAYMENT_ENV
        value: sandbox
      - key: INTEGRATION_ENCRYPTION_KEY
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: sortex-postgres-homologacao
    region: oregon
    plan: basic-256mb
    databaseName: sortex_homologacao
    user: sortex_homologacao
    ipAllowList: []
