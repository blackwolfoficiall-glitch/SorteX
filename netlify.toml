[build]
  base = "apps/web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"
  NEXT_TELEMETRY_DISABLED = "1"

# Next.js SSR and route handlers use Netlify's automatic OpenNext adapter.
# Set API_INTERNAL_URL and API_URL in the site's Builds + Functions environment.
# No SPA catch-all: it would override Next.js API/auth routes.
