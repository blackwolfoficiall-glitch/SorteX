services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sortex
      POSTGRES_USER: sortex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD}
    volumes: [sortex_pg:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U sortex -d sortex"], interval: 10s, timeout: 5s, retries: 5 }
  api:
    build: ./services/api
    env_file: ./services/api/.env
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["3333:3333"]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:3333/health/ready"], interval: 15s, timeout: 5s, retries: 5 }
    volumes: [sortex_uploads:/app/storage]
  web:
    build: ./apps/web
    environment: { API_URL: "http://api:3333" }
    depends_on: { api: { condition: service_healthy } }
    ports: ["3000:3000"]
volumes:
  sortex_pg:
  sortex_uploads:
